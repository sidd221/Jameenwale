<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap - Jameenwale</title>
    <style>
        body {
            font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #0f172a;
            color: #ffffff;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #D4AF37;
            margin-top: 0;
            font-size: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 15px;
        }
        a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #D4AF37;
        }
        .home-link {
            display: inline-block;
            margin-top: 40px;
            color: #D4AF37;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HTML Sitemap</h1>
        <p>Explore the sections of Jameenwale:</p>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/#about">About Us</a></li>
            <li><a href="/#properties">Featured Projects</a></li>
            <li><a href="/#amenities">Luxury Amenities</a></li>
            <li><a href="/#gallery">Digital Gallery</a></li>
            <li><a href="/#contact">Contact Us</a></li>
            <li><a href="/brochure.pdf" target="_blank" rel="noopener noreferrer">Company Brochure (PDF)</a></li>
            <li><a href="/sitemap.xml">XML Sitemap</a></li>
        </ul>
        <a href="/" class="home-link">&larr; Back to Home</a>
    </div>
</body>
</html>
